# MIDL-3: CI enforcing catalog checks, manifest freshness,
# type-checks and the TS/web/editor test suites; plus the Python validator
# tests and the live TS<->Python conformance parity check (midl#15).
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # C++17 helper tools (catalog checker + manifest generator).
      - name: Check C++ toolchain
        run: make check-tools

      - name: Validate catalog
        run: make check-catalog

      # Regenerate manifests and fail if the committed schemas are stale.
      - name: Manifest freshness
        run: |
          make gen-manifest
          git diff --exit-code schemas/gen

      - name: Install dependencies
        run: npm ci

      # ts/test/dist.test.ts imports ../dist/index.js, so both the ts
      # type-check (ts/tsconfig.json includes test/) and the ts vitest run
      # need the tsup build output to exist first.
      - name: Build (ts dist)
        run: npm run build -w @yey-boats/midl

      # midl#17: the publishable library builds, in dependency order, so a
      # broken build:lib is caught on PRs rather than on the release tag.
      - name: Build (web + editor lib)
        run: |
          npm run build:lib -w @yey-boats/midl-web
          npm run build:lib -w @yey-boats/midl-editor

      # Type-check the publishable sources of each workspace. The `.build`
      # configs cover src/; ts/tsconfig.json also covers test/ (which is why
      # the dist build above must come first). Full type-checking of the
      # editor/web *.test.ts(x) files is deferred: those carry pre-existing
      # type debt on main (tracked separately) and are exercised by vitest below.
      - name: Type-check (ts)
        run: npx tsc --noEmit -p ts/tsconfig.json

      - name: Type-check (web)
        run: npx tsc --noEmit -p web/tsconfig.build.json

      - name: Type-check (editor)
        run: npx tsc --emitDeclarationOnly -p editor/tsconfig.build.json

      - name: Test (ts)
        run: npm test -w @yey-boats/midl

      - name: Test (web)
        run: npm test -w @yey-boats/midl-web

      - name: Test (editor)
        run: npm test -w @yey-boats/midl-editor

  # midl#15: the Python validator (py/) and TS<->Python parity were never run
  # in CI. Installs py/, runs its pytest, then runs BOTH validators live over
  # conformance/cases.yaml and fails on any verdict difference (TS vs Python,
  # and each vs the frozen conformance/expected.json).
  python-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install py/ (with test extras)
        run: pip install -e "py[test]"

      - name: Test (py)
        run: pytest -v py/tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (ts dist)
        run: npm run build -w @yey-boats/midl

      - name: TS verdicts over conformance/cases.yaml
        run: node conformance/gen-expected.mjs --out "$RUNNER_TEMP/ts-verdicts.json"

      - name: TS vs Python validator parity
        run: python conformance/parity.py --ts "$RUNNER_TEMP/ts-verdicts.json"
