# midl#17: publish @yey-boats/midl, -web and -editor to GitHub Packages.
#
# Triggered ONLY by pushing a `v*` tag (never on branch pushes or PRs) so this
# can't fire by accident. Builds each workspace in dependency order — ts, then
# web, then editor, matching the dependency chain in their package.json
# `dependencies` — then publishes all three as restricted GitHub Packages.
#
# Registry choice (open question for the maintainer, see PR body): this uses
# GitHub Packages + --access restricted, the safe default that needs no new
# external registry account. Publishing to public npm instead is a later,
# deliberate choice (different registry-url, different access level, and a
# separate NPM_TOKEN secret).
name: Publish packages

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@yey-boats"

      - name: Install dependencies
        run: npm ci

      # Dependency order: ts -> web -> editor (web depends on
      # @yey-boats/midl; editor depends on both). Matches the "Build (ts
      # dist)" step in ci.yml for ts; web/editor use their own `build:lib`
      # library-build scripts since that's what produces the dist/ files
      # their package.json `main`/`module`/`types` fields point at (ci.yml
      # only type-checks web/editor, it doesn't build their dist).
      - name: Build (ts dist)
        run: npm run build -w @yey-boats/midl

      - name: Build (web dist)
        run: npm run build:lib -w @yey-boats/midl-web

      - name: Build (editor dist)
        run: npm run build:lib -w @yey-boats/midl-editor

      - name: Publish @yey-boats/midl
        run: npm publish --workspace @yey-boats/midl --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @yey-boats/midl-web
        run: npm publish --workspace @yey-boats/midl-web --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @yey-boats/midl-editor
        run: npm publish --workspace @yey-boats/midl-editor --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
