  # TS unit-test fixtures (ts/test/fixtures).
  - name: fixture-valid-minimal
    targetClass: square-480
    docFile: ts/test/fixtures/valid/minimal.yaml

  - name: fixture-valid-hero-split
    targetClass: square-480
    docFile: ts/test/fixtures/valid/hero-split.yaml

  - name: fixture-invalid-too-many-tiles
    targetClass: round-360
    note: 5 tiles exceed round-360's 4-tile budget (was written for the retired 4-tile sunton-480 fixture manifest)
    docFile: ts/test/fixtures/invalid/too-many-tiles.json

  - name: fixture-too-many-tiles-admissible-square-480
    targetClass: square-480
    note: the same 5-tile document is admissible on square-480 (9 tiles)
    docFile: ts/test/fixtures/invalid/too-many-tiles.json

  - name: fixture-invalid-unknown-element
    targetClass: square-480
    note: windrose is not in this class's element list (mirrors the retired sunton-480 fixture manifest)
    manifestOverrides:
      classes:
        - { id: square-480, width: 480, height: 480, maxTiles: 9, maxDepth: 3, presets: [full, hero-split], elements: [single-value, text, gauge, bar, compass] }
    docFile: ts/test/fixtures/invalid/unknown-element.json

  - name: fixture-unknown-element-admissible-square-480
    targetClass: square-480
    note: the same windrose document is admissible on the real square-480 manifest (dir optional)
    docFile: ts/test/fixtures/invalid/unknown-element.json
